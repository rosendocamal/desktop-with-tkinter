<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title description">
  <title id="title">Concepto previo de la pantalla de inicio de sesión</title>
  <desc id="description">Ilustración conceptual de la pantalla de acceso morada de Desktop with Tkinter, anterior a la implementación.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9209c8"/>
      <stop offset="1" stop-color="#520570"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#260033" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="960" height="600" rx="26" fill="#17111d"/>
  <rect x="14" y="14" width="932" height="572" rx="18" fill="url(#background)"/>
  <circle cx="72" cy="50" r="7" fill="#ff7c91"/>
  <circle cx="96" cy="50" r="7" fill="#ffd166"/>
  <circle cx="120" cy="50" r="7" fill="#7ee787"/>
  <text x="480" y="54" text-anchor="middle" fill="#ffffff" opacity=".75" font-family="Arial, sans-serif" font-size="16">SESSION INIT</text>
  <rect x="226" y="106" width="508" height="410" rx="18" fill="#ce63f8" opacity=".96" filter="url(#shadow)"/>
  <text x="480" y="203" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="36" font-weight="700">USER LOGIN</text>
  <text x="480" y="253" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="21" font-weight="700">@rosendocamal</text>
  <rect x="334" y="291" width="292" height="54" rx="7" fill="#ffffff" stroke="#72079c" stroke-width="2"/>
  <text x="480" y="327" text-anchor="middle" fill="#520570" font-family="Arial, sans-serif" font-size="23" letter-spacing="9">••••</text>
  <rect x="372" y="382" width="216" height="58" rx="8" fill="#f527c8"/>
  <text x="480" y="420" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="22" font-weight="700">LOGIN</text>
</svg>
